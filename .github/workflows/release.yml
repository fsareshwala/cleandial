name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to bump (ignored when custom_version is provided)
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      whats_new:
        description: "What's New in This Version (defaults to 'Bug fixes and performance improvements.')"
        type: string
        required: false
        default: ""
      custom_version:
        description: Explicit version override (e.g. 1.2.0)
        type: string
        required: false
        default: ""
      dry_run:
        description: Preview version bump without modifying Git or App Store Connect
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, tag, and submit to App Store Review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_BUNDLE_ID: com.fsareshwala.contactformatter
    steps:
      - name: Ensure release runs from default branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Releases must be triggered from the ${DEFAULT_BRANCH} branch (got ${GITHUB_REF_NAME})."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute and apply version bump
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          PBXPROJ: cleandial.xcodeproj/project.pbxproj
          TARGET_NAME: cleandial
          TAG_PREFIX: ios/v
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          pbxproj_path = Path(os.environ["PBXPROJ"])
          target_name = os.environ["TARGET_NAME"]
          bump = os.environ["BUMP"].strip()
          tag_prefix = os.environ["TAG_PREFIX"]
          custom_version = os.environ["CUSTOM_VERSION"].strip()
          if custom_version.startswith(tag_prefix):
              custom_version = custom_version[len(tag_prefix):]
          custom_version = custom_version.lstrip("v")
          dry_run = os.environ["DRY_RUN"].lower() == "true"

          text = pbxproj_path.read_text(encoding="utf-8")

          # 1. Find the native target's buildConfigurationList UUID.
          target_re = re.compile(
              r"[A-F0-9]{24}\s*/\*\s*" + re.escape(target_name) + r"\s*\*/\s*=\s*\{[^}]*?"
              r"isa = PBXNativeTarget;[^}]*?"
              r"buildConfigurationList = ([A-F0-9]{24})\b",
              re.DOTALL,
          )
          target_match = target_re.search(text)
          if not target_match:
              sys.exit(f"Could not find PBXNativeTarget '{target_name}' in {pbxproj_path}")
          config_list_id = target_match.group(1)

          # 2. Extract the build configuration UUIDs (Debug, Release, etc.) for that target.
          list_re = re.compile(
              re.escape(config_list_id) + r"\b[^=]*=\s*\{[^}]*?buildConfigurations = \(([^)]*)\);",
              re.DOTALL,
          )
          list_match = list_re.search(text)
          if not list_match:
              sys.exit(f"Could not find XCConfigurationList {config_list_id}")
          config_ids = re.findall(r"\b([A-F0-9]{24})\b", list_match.group(1))
          if not config_ids:
              sys.exit(f"No buildConfigurations found in {config_list_id}")

          # 3. Read current MARKETING_VERSION from each of the app target's build configs.
          def block_pattern(cfg_id: str) -> re.Pattern:
              return re.compile(
                  r"(" + re.escape(cfg_id) + r"\b[^=]*=\s*\{\s*isa = XCBuildConfiguration;.*?"
                  r"MARKETING_VERSION = )([0-9]+\.[0-9]+(?:\.[0-9]+)?)(;)",
                  re.DOTALL,
              )

          versions = []
          for cfg_id in config_ids:
              m = block_pattern(cfg_id).search(text)
              if not m:
                  sys.exit(f"Could not find MARKETING_VERSION in build config {cfg_id}")
              versions.append(m.group(2))

          if len(set(versions)) != 1:
              sys.exit(f"Mismatched MARKETING_VERSION across target configs: {versions}")
          current_version = versions[0]

          # 4. Compute and validate the next SemVer version.
          cur_m = re.match(r"^(\d+)\.(\d+)(?:\.(\d+))?$", current_version)
          if not cur_m:
              sys.exit(f"Current MARKETING_VERSION '{current_version}' is not X.Y or X.Y.Z")
          major = int(cur_m.group(1))
          minor = int(cur_m.group(2))
          patch = int(cur_m.group(3) or 0)

          semver_re = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          if custom_version:
              if not semver_re.match(custom_version):
                  sys.exit(f"custom_version '{custom_version}' must match X.Y.Z (e.g. 1.2.0)")
              new_version = custom_version
          elif bump == "major":
              new_version = f"{major + 1}.0.0"
          elif bump == "minor":
              new_version = f"{major}.{minor + 1}.0"
          elif bump == "patch":
              new_version = f"{major}.{minor}.{patch + 1}"
          else:
              sys.exit(f"Unsupported bump type: {bump}")

          if tuple(map(int, new_version.split("."))) <= (major, minor, patch):
              sys.exit(
                  f"New version ({new_version}) must be strictly greater than "
                  f"current version ({current_version})."
              )

          tag = f"{tag_prefix}{new_version}"
          existing = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}"],
              capture_output=True,
              text=True,
          )
          if existing.returncode == 0:
              sys.exit(f"Tag '{tag}' already exists.")

          # 5. Update MARKETING_VERSION strictly within the app target's build configs.
          updated = text
          for cfg_id in config_ids:
              updated, count = block_pattern(cfg_id).subn(
                  lambda m: f"{m.group(1)}{new_version}{m.group(3)}",
                  updated,
                  count=1,
              )
              if count != 1:
                  sys.exit(f"Expected 1 replacement for config {cfg_id}, got {count}")

          if not dry_run:
              pbxproj_path.write_text(updated, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"old_version={current_version}\n")
              out.write(f"new_version={new_version}\n")
              out.write(f"tag={tag}\n")

          print(f"Version bump: {current_version} -> {new_version} (tag: {tag}, dry_run: {dry_run})")
          PY

      - name: Install App Store Connect API dependencies
        if: ${{ !inputs.dry_run }}
        run: python3 -m pip install --quiet PyJWT cryptography

      - name: Preflight App Store Connect credentials
        if: ${{ !inputs.dry_run }}
        id: asc_preflight
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 .github/scripts/asc_release.py preflight --bundle-id "${APP_BUNDLE_ID}"

      - name: Commit, tag, and push
        if: ${{ !inputs.dry_run }}
        id: push
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cleandial.xcodeproj/project.pbxproj
          git commit -m "chore(release): ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"

          git push origin "HEAD:${DEFAULT_BRANCH}"
          git push origin "${TAG}"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "iOS v${NEW_VERSION}" \
            --generate-notes

      - name: Create App Store Connect version
        if: ${{ !inputs.dry_run }}
        id: asc_prepare
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_ID: ${{ steps.asc_preflight.outputs.app_id }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          python3 .github/scripts/asc_release.py prepare \
            --app-id "${APP_ID}" \
            --version "${NEW_VERSION}" \
            --whats-new "${WHATS_NEW}"

      - name: Wait for Xcode Cloud build and submit for App Review
        if: ${{ !inputs.dry_run }}
        id: asc_submit
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_ID: ${{ steps.asc_preflight.outputs.app_id }}
          VERSION_ID: ${{ steps.asc_prepare.outputs.version_id }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          STARTED_AT: ${{ steps.asc_preflight.outputs.started_at }}
        run: |
          python3 .github/scripts/asc_release.py submit \
            --app-id "${APP_ID}" \
            --version-id "${VERSION_ID}" \
            --version "${NEW_VERSION}" \
            --started-at "${STARTED_AT}" \
            --timeout-minutes 45

      - name: Write job summary
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          OLD_VERSION: ${{ steps.version.outputs.old_version }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.push.outputs.sha }}
          BUILD_NUMBER: ${{ steps.asc_submit.outputs.build_number }}
          SUBMISSION_STATE: ${{ steps.asc_submit.outputs.submission_state }}
        run: |
          {
            if [ "${DRY_RUN}" = "true" ]; then
              echo "### Dry Run — Release Preview"
            else
              echo "### Released ${TAG}"
            fi
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Previous Version | \`${OLD_VERSION}\` |"
            echo "| New Version | \`${NEW_VERSION}\` |"
            echo "| Git Tag | \`${TAG}\` |"
            if [ -n "${SHA}" ]; then
              echo "| Commit | \`${SHA}\` |"
            fi
            if [ -n "${BUILD_NUMBER}" ]; then
              echo "| App Store Build | \`${NEW_VERSION} (${BUILD_NUMBER})\` |"
            fi
            if [ -n "${SUBMISSION_STATE}" ]; then
              echo "| App Review Status | \`${SUBMISSION_STATE}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
